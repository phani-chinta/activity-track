{% extends 'base.html' %}{% block title %}{{ heading }} | TaskFlow{% endblock %}{% block content %}<div class="form-card mx-auto wide-card"><a href="{% if task %}{% url 'task_detail' task.pk %}{% else %}{% url 'task_list' %}{% endif %}" class="small text-decoration-none">← Back</a><h1 class="h3 mt-3 mb-4">{{ heading }}</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save task</button><a class="btn btn-outline-secondary" href="{% if task %}{% url 'task_detail' task.pk %}{% else %}{% url 'task_list' %}{% endif %}">Cancel</a></div></form></div>{% endblock %}
